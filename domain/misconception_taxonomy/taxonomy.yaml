# --- ACCURACY ---
- id: wrong_operation_applied
  description: Applies the wrong arithmetic operation, or makes an execution error while applying an operation (addition, subtraction, multiplication, or division)
  dimension: accuracy

- id: doubly_subtracting_or_doubly_adding
  description: Doesn't realize they are double-counting — subtracting or adding the same given number more than once
  dimension: accuracy

- id: wrong_fraction
  description: Repeatedly uses the wrong fraction to represent a quantity in the problem
  dimension: accuracy

- id: ratio_confusion
  description: Confuses how the ratio and fraction values given in the question relate to each other
  dimension: accuracy

- id: wrong_order_solving
  description: Solves the problem's steps in the wrong order, producing a wrong answer even though individual operations may be correct
  dimension: accuracy

- id: unnecessary_steps
  description: Introduces extra, unneeded steps that lead to a wrong answer
  dimension: accuracy

- id: confusing_numbers
  description: Performs a correct operation but on the wrong set of numbers from the problem
  dimension: accuracy

- id: assumes_missing_values
  description: Assumes a value not given in the problem, instead of deriving or requesting it
  dimension: accuracy

- id: misreads_problem
  description: Interprets what the question is asking differently from what was actually asked, leading to solving a different problem
  dimension: accuracy

# --- COMPLETENESS ---
- id: needs_next_step
  description: Correctly understands and completes the current step, but stops before taking the next required step toward the final answer
  dimension: completeness

- id: concept_not_understood
  description: Is unsure of the underlying concept entirely and doesn't know how to proceed
  dimension: completeness

- id: incomplete_concept
  description: Understands the concept only partially, applying it in some places but not fully carrying it through
  dimension: completeness

- id: missed_details
  description: Omits a detail given in the problem statement while solving, leading to an incomplete or incorrect setup
  dimension: completeness

# --- COHERENCE ---
- id: disorganized_reasoning
  description: Performs individually correct steps but loses track of how they connect, or presents the solution in a disorganized way that obscures the reasoning flow
  dimension: coherence

