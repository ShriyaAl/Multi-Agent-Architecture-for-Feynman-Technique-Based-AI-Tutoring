# --- ACCURACY ---
- id: wrong_operation_applied
  description: Applies the wrong arithmetic operation or makes a calculation execution error (e.g. divides where they should multiply or adds where they should subtract)
  dimension: accuracy

- id: doubly_subtracting_or_doubly_adding
  description: Double-counts a value — subtracts or adds the same number more than once across steps
  dimension: accuracy

- id: wrong_fraction
  description: Uses the wrong fraction or ratio component to represent a quantity in the problem
  dimension: accuracy

- id: unnecessary_steps
  description: Introduces extra unneeded steps that change or invalidate a correct intermediate answer
  dimension: accuracy

# --- COMPLETENESS ---
- id: needs_next_step
  description: Correctly understands the current step but stops before taking the next required step toward the final answer
  dimension: completeness

- id: concept_not_understood
  description: Does not understand the underlying concept and does not know how to proceed
  dimension: completeness

- id: missed_details
  description: Omits a detail from the problem statement while solving leading to an incomplete or incorrect setup
  dimension: completeness

# --- COHERENCE ---
- id: disorganized_reasoning
  description: Performs correct individual steps but loses track of how they connect or presents them in a disorganized way that obscures the reasoning flow
  dimension: coherence

- id: redundant_steps
  description: Arrives at the correct answer but then continues doing unnecessary work contradicting or overriding the correct result
  dimension: coherence

- id: misreads_problem
  description: Interprets what the question is asking differently from what was actually asked leading to solving a different problem
  dimension: coherence

# --- CLARITY ---
# NOTE: Only 2 nodes here — clarity is the thinnest dimension in the source data.
# The prompt-level empty-list guard is active so this dimension will not hallucinate IDs
# even if it were 0 nodes. These 2 nodes are grounded in real source entries.
- id: ambiguous_quantity_reference
  description: Uses vague or interchangeable references to quantities making it unclear which number or ratio part is being operated on
  dimension: clarity

- id: language_interpretation_gap
  description: Struggles with language in the problem statement — misreads a term or phrase — leading to a different interpretation than intended
  dimension: clarity